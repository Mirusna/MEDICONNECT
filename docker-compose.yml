version: "3.9"

services:
  db:
    image: postgres:16
    container_name: mediconnect-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: mediconnect
      POSTGRES_PASSWORD: mediconnect
      POSTGRES_DB: mediconnect
    ports:
      - "5432:5432"
    volumes:
      - mediconnect_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mediconnect -d mediconnect"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    container_name: mediconnect-backend
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+psycopg://mediconnect:mediconnect@db:5432/mediconnect
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./backend:/app

volumes:
  mediconnect_pgdata:
